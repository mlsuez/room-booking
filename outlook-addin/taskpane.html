<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserva de Salas</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; color: #1c1c1a; background: #f5f5f4; padding: 12px; }
    h2 { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
    .room { background: white; border-radius: 8px; border: 1px solid #e8e8e6; padding: 12px; margin-bottom: 8px; }
    .room h3 { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
    .available { color: #166534; font-size: 13px; }
    .occupied { color: #b91c1c; font-size: 13px; }
    .blocked { color: #b45309; font-size: 13px; }
    button { margin-top: 8px; width: 100%; padding: 8px; border-radius: 6px; border: none; background: #1c1c1a; color: white; font-size: 13px; cursor: pointer; }
    button:disabled { background: #ccc; cursor: default; }
    .info { font-size: 12px; color: #888; margin-bottom: 12px; }
    .msg { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-bottom: 8px; }
    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .msg.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
    #loading { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <h2>🏢 Reserva de Salas</h2>
  <div id="info" class="info"></div>
  <div id="msg"></div>
  <div id="content"><div id="loading">Cargando...</div></div>

  <script>
    const API_URL = 'https://room-booking-production-18f7.up.railway.app';
    const API_KEY = 'ADDON_KEY_PLACEHOLDER';

    Office.onReady(() => {
      const item = Office.context.mailbox.item;
      const start = item.start;
      const end = item.end;

      start.getAsync(r1 => {
        end.getAsync(r2 => {
          const s = r1.value;
          const e = r2.value;
          const date = s.toISOString().split('T')[0];
          const startTime = pad(s.getHours()) + ':' + pad(s.getMinutes());
          const endTime = pad(e.getHours()) + ':' + pad(e.getMinutes());

          document.getElementById('info').textContent = date + '  ' + startTime + ' – ' + endTime;
          loadRooms(date, startTime, endTime);
        });
      });
    });

    function pad(n) { return String(n).padStart(2, '0'); }

    async function loadRooms(date, startTime, endTime) {
      try {
        const res = await fetch(`${API_URL}/api/addon/availability?date=${date}`, {
          headers: { 'x-addon-key': API_KEY }
        });
        const rooms = await res.json();
        renderRooms(rooms, date, startTime, endTime);
      } catch {
        document.getElementById('content').innerHTML = '<p class="occupied">Error al cargar disponibilidad.</p>';
      }
    }

    function checkAvailable(room, startTime, endTime) {
      for (const b of room.blocked) {
        if (startTime < b.end && endTime > b.start) return { available: false, reason: b.reason };
      }
      for (const b of room.bookings) {
        if (startTime < b.end_time.substring(0,5) && endTime > b.start_time.substring(0,5)) {
          return { available: false, reason: b.title + ' (' + b.user_name + ')' };
        }
      }
      return { available: true };
    }

    function renderRooms(rooms, date, startTime, endTime) {
      const html = rooms.map(room => {
        const avail = checkAvailable(room, startTime, endTime);
        return `<div class="room">
          <h3>${room.name}</h3>
          ${avail.available
            ? `<span class="available">🟢 Disponible</span>
               <button onclick="bookRoom('${room.id}','${room.name}','${date}','${startTime}','${endTime}',this)">Reservar</button>`
            : `<span class="occupied">🔴 Ocupada: ${avail.reason}</span>`}
        </div>`;
      }).join('');
      document.getElementById('content').innerHTML = html;
    }

    async function bookRoom(roomId, roomName, date, startTime, endTime, btn) {
      btn.disabled = true;
      btn.textContent = 'Reservando...';
      const email = Office.context.mailbox.userProfile.emailAddress;
      try {
        const res = await fetch(`${API_URL}/api/addon/book`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-addon-key': API_KEY },
          body: JSON.stringify({ room_id: roomId, date, start_time: startTime, end_time: endTime, title: 'Reunión', user_name: email, user_email: email })
        });
        const msg = document.getElementById('msg');
        if (res.status === 201) {
          msg.innerHTML = `<div class="msg success">✅ ${roomName} reservada</div>`;
          btn.closest('.room').querySelector('span').textContent = '🟢 Reservada por vos';
          btn.remove();
        } else if (res.status === 409) {
          msg.innerHTML = `<div class="msg error">❌ El horario ya fue reservado</div>`;
          btn.disabled = false;
          btn.textContent = 'Reservar';
        } else {
          msg.innerHTML = `<div class="msg error">❌ Error al reservar</div>`;
          btn.disabled = false;
          btn.textContent = 'Reservar';
        }
      } catch {
        document.getElementById('msg').innerHTML = `<div class="msg error">❌ Error de conexión</div>`;
        btn.disabled = false;
        btn.textContent = 'Reservar';
      }
    }
  </script>
</body>
</html>
